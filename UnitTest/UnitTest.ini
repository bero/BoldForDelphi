[Database]
; Database engine: SQLServer, SQLite, Interbase, Firebird, PostgreSQL
; Override without editing this file: set the environment variable BOLD_TEST_ENGINE
Engine=SQLite

[SQLServer]
; Connection string parameters for SQL Server Express
Server=DESKTOP-U4S6449
Database=BoldUnitTest
; Use Windows Authentication (leave User and Password empty)
; Or specify SQL Server authentication
User=sa
Password=masterkey
OSAuthentication=No

[SQLite]
; SQLite shared-cache in-memory (fast, no file, no cleanup needed)
Database=file:memdb1?mode=memory&cache=shared

[Interbase]
Server=localhost
Database=C:\Data\BoldUnitTest.gdb
User=SYSDBA
Password=masterkey

[Firebird]
; Firebird database settings
Server=localhost
Database=C:\Data\BoldUnitTest.fdb
User=SYSDBA
Password=masterkey

[PostgreSQL]
Server=localhost
Port=5432
Database=boldunittest
User=postgres
Password=
