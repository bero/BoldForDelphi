name: FPC tests

# Builds Bold and its unit tests with Free Pascal on Linux and runs the FPCUnit
# suite (UnitTest/FPC/build.sh), so a change made and tested in Delphi cannot
# break the Lazarus/Free Pascal build unnoticed (#117). A second run under
# heaptrc catches memory leaks and uses of freed memory. A second job builds the
# Lazarus packages with lazbuild through the Invoicing example's LCL client,
# whose self-test it runs, and its runner on SQLite through Zeos. The Delphi
# suite still runs on Windows only.

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpc-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zeos is required for the FPC build (UnitTest/README.md) and is never
  # vendored: the official 8.0.0 release from SourceForge, checked against this
  # SHA-256 before use.
  ZEOS_ZIP_URL: https://downloads.sourceforge.net/project/zeoslib/Zeos%20Database%20Objects/zeosdbo-8.0.0-stable/zeosdbo-8.0.0-stable.zip
  ZEOS_ZIP_SHA256: 21398d4015e3fb43c56e9c0b3101ae2a8f9e71fa41c66f826224cee493040e92

jobs:
  fpc:
    name: FPC 3.2.2 + Zeos 8.0.0, Ubuntu 26.04
    runs-on: ubuntu-latest
    # The job runs in an Ubuntu 26.04 container, the OS the Linux development
    # machine runs, so CI gets the same FPC build (3.2.2+dfsg-49). Steps run as
    # root there, with no sudo.
    container:
      image: ubuntu:26.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The downloaded .deb files are cached, so after the first run the install
      # needs no apt-get update and no mirror (one run got the 20 MB at
      # 53 kB/s, 6 minutes). Cached paths are relative to the workspace:
      # runner.temp may name the host's path in a container job. Bump the
      # version in the key when FPC_PACKAGES changes.
      - name: Cache the FPC packages
        id: fpc-debs
        uses: actions/cache@v4
        with:
          path: .ci-cache/fpc-debs
          key: fpc-debs-ubuntu-26.04-fpc-3.2.2-v1

      - name: Install Free Pascal and SQLite
        # Only what the build loads: the compiler and the rtl, base (regexpr)
        # and fcl (db, fpcunit, xml) units. The fpc metapackage would add the
        # IDE and the gtk2, db, gfx, math, misc, multimedia and net units.
        # gcc and libc6-dev provide the C runtime the test runner links
        # against (cthreads, cwstring); curl, ca-certificates and unzip get
        # Zeos. The container image has none of them.
        env:
          FPC_PACKAGES: >-
            fp-compiler-3.2.2 fp-units-rtl-3.2.2 fp-units-base-3.2.2 fp-units-fcl-3.2.2
            gcc libc6-dev libsqlite3-0 curl ca-certificates unzip
          CACHE_HIT: ${{ steps.fpc-debs.outputs.cache-hit }}
        run: |
          DEBS="$GITHUB_WORKSPACE/.ci-cache/fpc-debs"
          mkdir -p "$DEBS/partial"
          if [ "$CACHE_HIT" = "true" ] && dpkg -i "$DEBS"/*.deb; then
            echo "Installed from the cached packages"
          else
            apt-get update
            # The downloads land in $DEBS, which the cache step saves
            apt-get install -y --no-install-recommends \
              -o Dir::Cache::Archives="$DEBS" $FPC_PACKAGES
          fi
          fpc -iV

      - name: Cache the Zeos archive
        uses: actions/cache@v4
        with:
          path: .ci-cache/zeosdbo-8.0.0-stable.zip
          key: zeosdbo-8.0.0-stable-${{ env.ZEOS_ZIP_SHA256 }}

      - name: Get Zeos 8.0.0
        run: |
          ZIP="$GITHUB_WORKSPACE/.ci-cache/zeosdbo-8.0.0-stable.zip"
          if [ ! -f "$ZIP" ]; then
            curl -fsSL --retry 5 --retry-delay 10 -o "$ZIP" "$ZEOS_ZIP_URL"
          fi
          echo "$ZEOS_ZIP_SHA256  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/zeosdbo-8.0.0"

      - name: Build and run the FPC test suite
        run: ZEOS="$RUNNER_TEMP/zeosdbo-8.0.0" sh UnitTest/FPC/build.sh

      # The same suite under heaptrc: freed memory is overwritten, so a use of
      # freed memory raises instead of passing by luck, and build.sh fails when
      # the run leaves memory unfreed, printing the line that allocated it.
      - name: Run the FPC test suite under heaptrc
        run: BOLD_HEAPTRC=1 ZEOS="$RUNNER_TEMP/zeosdbo-8.0.0" sh UnitTest/FPC/build.sh

      # The Invoicing example's scenario runner and FPCUnit tests, on XML file
      # persistence (no Zeos).
      - name: Build and run the Invoicing example
        run: sh examples/Compound/Invoicing/FPC/build.sh

  lazarus:
    name: Lazarus 4.4, the Bold packages, the LCL client and the Zeos runner, Ubuntu 26.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    # The first run, and a run after the cache was evicted, download about
    # 270 MB; a slow mirror must not time out before the cache is saved.
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lazarus with the Qt5 widgetset is about 280 packages (270 MB), so the
      # downloaded .deb files are cached together with apt's package lists:
      # with both, apt installs with no mirror and still orders the packages
      # itself (dpkg -i on the folder stops at a pre-dependency). Bump the
      # version in the key when LAZARUS_PACKAGES changes.
      - name: Cache the Lazarus packages
        id: lazarus-debs
        uses: actions/cache@v4
        with:
          path: .ci-cache/lazarus
          key: lazarus-debs-ubuntu-26.04-lazarus-4.4-qt5-v2

      - name: Install Lazarus
        # lcl-utils has lazbuild, lcl-units the compiled LCL, lcl-qt5 and
        # libqt5pas-dev the widgetset the client is built for, and
        # fp-units-misc a unit the LCL's clipboard support uses. gcc and
        # libc6-dev provide the C runtime to link against. libsqlite3-0 is
        # what the Zeos runner loads; curl, ca-certificates and unzip get Zeos.
        env:
          LAZARUS_PACKAGES: >-
            lcl-utils-4.4 lcl-units-4.4 lcl-qt5-4.4 libqt5pas-dev fp-units-misc-3.2.2
            gcc libc6-dev libsqlite3-0 curl ca-certificates unzip
          CACHE_HIT: ${{ steps.lazarus-debs.outputs.cache-hit }}
        run: |
          CACHE="$GITHUB_WORKSPACE/.ci-cache/lazarus"
          mkdir -p "$CACHE/debs/partial" "$CACHE/lists/partial"
          APT="-o Dir::Cache::Archives=$CACHE/debs -o Dir::State::Lists=$CACHE/lists -o Acquire::Retries=5"
          if [ "$CACHE_HIT" = "true" ] && apt-get install -y --no-install-recommends --no-download $APT $LAZARUS_PACKAGES; then
            echo "Installed from the cached packages"
          else
            if [ "$CACHE_HIT" = "true" ]; then
              # The cache is saved under a key that already exists, so it stays as it is
              echo "::warning::The cached Lazarus packages were unusable and came from the mirror instead; bump the cache key"
            fi
            apt-get update $APT
            apt-get install -y --no-install-recommends $APT $LAZARUS_PACKAGES
          fi
          lazbuild --version

      # build.sh builds InvoicingLCL.lpi, which requires packages/Lazarus/Bold.lpk,
      # so lazbuild compiles the package first. The Lazarus configuration folder
      # is a new one, so the build cannot lean on a configuration that already
      # knows the package. The self-test shows no window; Qt's offscreen
      # platform stands in for the display the runner does not have.
      - name: Build Bold.lpk and the Invoicing LCL client, run its self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: LAZBUILD_OPTIONS="--pcp=$RUNNER_TEMP/lazarus-config" sh examples/Compound/Invoicing/LCL/build.sh

      # The design-time package dclBold, and BoldRegistrationCheck: without
      # the IDE it catches what the package registers and writes every
      # component as form text and reads it back.
      - name: Build dclBold.lpk and check what it registers
        run: LAZBUILD_OPTIONS="--pcp=$RUNNER_TEMP/lazarus-config" sh packages/Lazarus/tests/build.sh

      # The same archive and cache as in the fpc job.
      - name: Cache the Zeos archive
        uses: actions/cache@v4
        with:
          path: .ci-cache/zeosdbo-8.0.0-stable.zip
          key: zeosdbo-8.0.0-stable-${{ env.ZEOS_ZIP_SHA256 }}

      - name: Get Zeos 8.0.0
        run: |
          ZIP="$GITHUB_WORKSPACE/.ci-cache/zeosdbo-8.0.0-stable.zip"
          if [ ! -f "$ZIP" ]; then
            curl -fsSL --retry 5 --retry-delay 10 -o "$ZIP" "$ZEOS_ZIP_URL"
          fi
          echo "$ZEOS_ZIP_SHA256  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/zeosdbo-8.0.0"

      # build.sh registers Zeos's Lazarus packages and builds InvoicingZeos.lpi,
      # which requires BoldZeos.lpk, so lazbuild compiles the Zeos packages and
      # BoldZeos first. The runner then runs the Invoicing scenario on a SQLite
      # file through Zeos, with a save, a close and a reopen.
      - name: Build BoldZeos.lpk and the Invoicing runner on SQLite through Zeos, run it
        run: >-
          ZEOS="$RUNNER_TEMP/zeosdbo-8.0.0"
          LAZBUILD_OPTIONS="--pcp=$RUNNER_TEMP/lazarus-config"
          sh examples/Compound/Invoicing/Zeos/build.sh
