site_name: Bold for Delphi
site_description: Documentation for Bold for Delphi - Model-Driven Architecture (MDA) and ORM Framework
site_url: https://bero.github.io/BoldForDelphi/
repo_url: https://github.com/bero/BoldForDelphi
repo_name: bero/BoldForDelphi
edit_uri: edit/develop/docs/
strict: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes       # Section index pages (folder/index.md)
    - navigation.top           # Back to top button
    - navigation.tracking      # URL updates with anchor
    - toc.follow               # TOC follows scroll position
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en
      separator: '[\\s\\-]+'
  - git-revision-date-localized:
      type: datetime

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

