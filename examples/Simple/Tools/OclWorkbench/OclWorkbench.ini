; Configuration for the OCL Workbench demo.
;
; The shared TDemoDataModule reads the .ini whose name matches the executable,
; so OclWorkbench.exe reads OclWorkbench.ini. The database name below is
; deliberately different from the one the other demos use, so that seeding a
; population here does not disturb them.
;
; SQLite needs no server and no setup: the file is created on first run when
; you answer yes to the "database does not exist" prompt.

[Database]
; Persistence: FireDAC, UniDAC, or XML
Persistence=FireDAC
; Supported types: MSSQL, PostgreSQL, Firebird, SQLite, MariaDB, Oracle
; (ignored for XML persistence)
Type=MSSQL

[SQLite]
Database=OclWorkbench.db

[MSSQL]
Server=localhost
Database=BoldOclWorkbench
; OSAuthent selects which of the two logins is used, and the other one is then
; ignored completely.
;   True  - Windows Authentication. User and Password below are NOT sent, so a
;           refused login means the Windows account running this demo has no
;           login on the server. Editing Password will not help.
;   False - SQL Server Authentication, using User and Password below.
OSAuthent=True
User=sa
Password=

[PostgreSQL]
Server=localhost
Database=boldoclworkbench
User=postgres
Password=<PW>
; VendorLib tells FireDAC where to find libpq.dll
VendorLib=C:\Program Files\PostgreSQL\18\bin\libpq.dll

[Firebird]
Server=localhost
Database=C:\Data\BoldOclWorkbench.fdb
User=SYSDBA
Password=<PW>
; VendorLib tells FireDAC where to find fbclient.dll
VendorLib=C:\Program Files\Firebird\Firebird_5_0\fbclient.dll

[MariaDB]
Server=localhost
Port=3306
Database=boldoclworkbench
User=root
Password=<PW>
; VendorLib tells FireDAC where to find libmariadb.dll
VendorLib=C:\Program Files\MariaDB\libmysql.dll

[Oracle]
; Database is the TNS name or Easy Connect string (host:port/service)
Database=localhost:1521/FREEPDB1
; User is the schema name
User=boldoclworkbench
Password=<PW>
AdminUser=SYSTEM
AdminPassword=<PW>
; VendorLib tells FireDAC where to find oci.dll
VendorLib=C:\app\Developer\product\26ai\dbhomeFree\bin\oci.dll

[XML]
; Evaluate in PS is meaningless with XML persistence: there is no SQL to
; translate to, so every expression is answered from memory.
FileName=OclWorkbench.xml
CacheData=True
