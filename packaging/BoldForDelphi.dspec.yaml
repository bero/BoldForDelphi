min dpm client version: 1.0

# DPM package specification for Bold for Delphi.
# Reference: docs/dspec-format.md in https://github.com/DelphiPackageManager/DPM
# Pack from the repository root (the paths below are relative to it):
#   dpm pack packaging\BoldForDelphi.dspec.yaml -basepath=. -o=<output folder>
# One .dpkg per compiler (11.0, 12.0, 13.0), design-time package dclBold. Win32
# everywhere, plus Win64 from Delphi 12 onwards - see note 3. The version must
# equal the release tag (see packaging/release-checklist.md).

metadata:
  id: bero.BoldForDelphi
  version: 26.9.0
  description: >-
    Bold for Delphi - a Model Driven Architecture framework with UML modelling,
    OCL expressions, code generation and object-relational persistence.
    Community-maintained fork of the framework open-sourced by Embarcadero.
  authors:
    - Boldsoft AB
    - Bold for Delphi community
  projectUrl: https://github.com/bero/BoldForDelphi
  repositoryUrl: https://github.com/bero/BoldForDelphi
  repositoryType: git
  license: MIT
  copyright: Boldsoft AB, Embarcadero Technologies, Bold for Delphi community
  # frameworks: [VCL] is omitted on purpose: dpm 0.9.317 writes it lower-case into the
  # packed spec and delphi.dev's schema then rejects the push (expects VCL|FMX|None).
  readme: README.md
  tags:
    - orm
    - mda
    - uml
    - ocl
    - persistence

variables:
  # Bold's package folders are named after the product version, which does not
  # match DPM's compiler ids, so each target maps its own folder and suffix.
  packageFolder: "Delphi12.3"
  libSuffix: "290"

targetPlatforms:
  - compiler: 11.0            # Delphi 11 Alexandria
    platforms: [Win32]
    variables:
      packageFolder: "Delphi11.3"
      libSuffix: "280"

  - compiler: 12.0            # Delphi 12 Athens - covers 12.1 and 12.3 alike
    platforms: [Win32, Win64]
    variables:
      packageFolder: "Delphi12.3"
      libSuffix: "290"

  - compiler: 13.0            # Delphi 13 Florence
    platforms: [Win32, Win64]
    variables:
      packageFolder: "Delphi13"
      libSuffix: "370"

templates:
  - name: default
    source:
      # 710 units across 153 folders - the tree is shipped whole so the
      # relative unit paths inside the .dpk keep resolving.
      - src: ./Source/**/*.pas
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.inc
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.dfm
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.res
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.dcr
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.rc
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./packages/$packageFolder$/dclBold.dpk
        dest: packages/$packageFolder$
      - src: ./packages/$packageFolder$/dclBold.dproj
        dest: packages/$packageFolder$
      - src: ./packages/$packageFolder$/dclBold.res
        dest: packages/$packageFolder$
      - src: ./LICENSE
      # README.md is packed by metadata.readme; listing it here duplicates the entry

    design:
      # designide is added automatically by DPM for design entries.
      - project: ./packages/$packageFolder$/dclBold.dproj
        platforms: [Win32, Win64]
        libPrefix: dcl
        libSuffix: $libSuffix$

# Notes for whoever picks this up:
#
# 1. DPM targets compiler MAJORS. Every 12.x is compiler 12.0, so one 12.x
#    package project is expressed here (12.3); with LIBSUFFIX AUTO the built
#    file is dclBold290.bpl and loads in any 12.x, which share the 290 runtime.
#
# 2. dclBold requires FireDAC, IndySystem, IndyCore, DesignIDE, vcl, vcldb,
#    soaprtl, dbrtl and inet - all shipped with RAD Studio, so no DPM
#    dependencies are declared.
#
# 3. Win64 is declared per compiler, because only Delphi 12 and 13 can build it:
#    Delphi 11 ships no Win64 DesignIDE and the package build stops with
#    "E2202: Required package 'DesignIDE' not found", so compiler 11.0 stays
#    Win32 alone. The design entry above lists both platforms all the same - DPM
#    intersects that list with each target's platforms instead of overriding
#    them, so the 11.0 package still packs and installs as Win32 only.
#    Declaring Win64 in targetPlatforms is not by itself enough: DPM derives the
#    platforms a package supports from the build/design entries, so without the
#    Win64 design entry an install reports "Platform [win64] not supported".
#    What Win64 gives the consumer is lib\Win64 - the DCUs a 64-bit application
#    compiles against; before this, Win64 consumers got no usable search path.
#
# 4. Publishing: `dpm pack` produces one .dpkg per compiler/platform. Attach
#    them to the GitHub release (consumers add their download folder as a
#    source) and/or `dpm push` to the public feed https://delphi.dev, which
#    needs an account there.
