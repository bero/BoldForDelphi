min dpm client version: 1.0

# DRAFT - not added to the repository yet.
# Verified against DPM docs (docs.delphi.dev) and the parser source
# (Source/Core/Spec/DPM.Core.Spec.Template.pas) on 2026-08-16.
#
# Template sections the parser actually reads:
#   name, dependencies, source, build, design, copyToLib, copyToBin,
#   copyLocal, package definitions, precompiledBinaries, environmentVariables
# There is NO searchPaths section - consumers get search paths from the
# 'dest' folders of the shipped source. This is the one point to confirm
# against a published package before relying on it; DPM's own docs say
# they are out of date.

metadata:
  id: bero.BoldForDelphi
  version: 26.8.1
  description: >
    Bold for Delphi - a Model Driven Architecture framework with UML modelling,
    OCL expressions, code generation and object-relational persistence.
    Community-maintained fork of the framework open-sourced by Embarcadero.
  authors:
    - Boldsoft AB
    - Bold for Delphi community
  projectUrl: https://github.com/bero/BoldForDelphi
  repositoryUrl: https://github.com/bero/BoldForDelphi
  license: MIT
  readme: README.md
  tags:
    - orm
    - mda
    - uml
    - ocl
    - persistence

variables:
  # Bold's package folders are named after the product version, which does not
  # match DPM's compiler ids, so each target maps its own folder and suffix.
  packageFolder: "Delphi12.3"
  libSuffix: "290"

targetPlatforms:
  - compiler: 11.0            # Delphi 11 Alexandria
    platforms: [Win32]
    variables:
      packageFolder: "Delphi11.3"
      libSuffix: "280"

  - compiler: 12.0            # Delphi 12 Athens - covers 12.1 and 12.3 alike
    platforms: [Win32]
    variables:
      packageFolder: "Delphi12.3"
      libSuffix: "290"

  - compiler: 13.0            # Delphi 13 Florence
    platforms: [Win32]
    variables:
      packageFolder: "Delphi13"
      libSuffix: "370"

templates:
  - name: default
    source:
      # 710 units across 153 folders - the tree is shipped whole so the
      # relative unit paths inside the .dpk keep resolving.
      - src: ./Source/**/*.pas
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.inc
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.dfm
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./Source/**/*.res
        dest: Source
        exclude:
          - ./Source/Deprecated/**
      - src: ./packages/$packageFolder$/dclBold.dpk
        dest: packages/$packageFolder$
      - src: ./packages/$packageFolder$/dclBold.dproj
        dest: packages/$packageFolder$
      - src: ./packages/$packageFolder$/dclBold.res
        dest: packages/$packageFolder$
      - src: ./LICENSE
        dest: .
      - src: ./README.md
        dest: .

    design:
      # designide is added automatically by DPM for design entries.
      - project: ./packages/$packageFolder$/dclBold.dproj
        platforms: [Win32]
        libPrefix: dcl
        libSuffix: $libSuffix$

# Notes for whoever picks this up:
#
# 1. DPM targets compiler MAJORS. 12.1 CE and 12.3 are both compiler 12.0, so
#    only one 12.x package project can be expressed here. 12.3 is used; the
#    resulting BPL is dclBold.29.3.bpl and loads in both, since 12.x shares the
#    290 runtime packages.
#
# 2. dclBold requires FireDAC, IndySystem, IndyCore, DesignIDE, vcl, vcldb,
#    soaprtl, dbrtl and inet - all shipped with RAD Studio, so no DPM
#    dependencies are declared.
#
# 3. Design-time packages are Win32 only (Win64 from Delphi 12 onwards per the
#    DPM docs). Bold's packages are Win32 designtime, so Win32 alone is right.
#
# 4. Publishing: `dpm pack` produces one .dpkg per compiler/platform, then push
#    to a feed. The public feed is https://delphi.dev/api/v1/index.json and
#    needs an account with the DPM maintainers.
